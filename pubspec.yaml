name: core_canvas_engine
description: "A high-performance native C++20 rendering engine for Flutter FFI to export PDF, PNG, JPG, WebP, HTML5, and Animated GIF from one Flexbox DSL."
version: 1.0.0
homepage: https://github.com/deepakkumarsp000/core_canvas_engine
repository: https://github.com/deepakkumarsp000/core_canvas_engine
issue_tracker: https://github.com/deepakkumarsp000/core_canvas_engine/issues

topics:
  - pdf
  - canvas
  - ffi
  - image
  - animation

environment:
  sdk: ^3.11.5
  flutter: '>=3.24.0'

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      # Uncomment after verifying Xcode/CocoaPods native build on macOS:
      # ios:
      #   ffiPlugin: true